[project]
name = "grover"
version = "0.1.0"
description = "Automated daily newspaper for Pacific Grove, CA"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "playwright>=1.44",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "anthropic>=0.34",
    "PyYAML>=6.0",
    "PyJWT>=2.8",
]

[tool.setuptools.packages.find]
where = ["src"]
